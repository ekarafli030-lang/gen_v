<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media & Layout</title>
    <link rel="icon" type="image/x-icon" href="assets/asa.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1b1522;
            --paper: #fbf8fc;
            --muted: #6d6378;
            --line: #e6dfee;
            --accent: #c2185b;
            --radius: 14px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            line-height: 1.6;
            /* Gambar latar tetap, dengan lapisan gelap agar konten mudah dibaca */
            background:
                linear-gradient(rgba(20, 12, 28, 0.72), rgba(20, 12, 28, 0.72)),
                url("assets/babymonster.jpg") center / cover fixed no-repeat;
            background-color: var(--ink);
        }

        .page {
            max-width: 920px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        header {
            color: #fff;
            text-align: center;
            margin-bottom: 36px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 0;
            color: #d9cfe3;
            font-size: 1rem;
        }

        .card {
            background: var(--paper);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .card h2 {
            margin: 0 0 4px;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .card .desc {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* Semua media mengikuti lebar kartu */
        .card img,
        .card video,
        .card audio {
            display: block;
            width: 100%;
            border-radius: 10px;
        }

        .card img {
            height: auto;
            max-height: 560px;
            object-fit: cover;
        }

        .card video { background: #000; }

        /* Bingkai 16:9 untuk video YouTube */
        .embed {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }

        .embed iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        audio:focus-visible,
        video:focus-visible,
        iframe:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        footer {
            text-align: center;
            color: #bfb2cc;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .page { padding: 32px 14px 48px; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <h1>Media & Layout</h1>
            <p>Galeri gambar, audio, video, dan video YouTube.</p>
        </header>

        <!-- Tag image -->
        <section class="card">
            <h2>Gambar</h2>
            <p class="desc">Foto utama.</p>
            <img src="assets/Asa.jpg" alt="Foto Asa">
        </section>

        <!-- Tag audio -->
        <section class="card">
            <h2>Audio</h2>
            <p class="desc">Lagu Jawa.</p>
            <audio controls preload="none">
                <source src="assets/lagu jawa.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung pemutar audio.
            </audio>
        </section>

        <!-- Tag video -->
        <section class="card">
            <h2>Video</h2>
            <p class="desc">Video Asa.</p>
            <video controls preload="metadata">
                <source src="assets/video asa.mp4" type="video/mp4">
                Browser Anda tidak mendukung pemutar video.
            </video>
        </section>

        <!-- Tag embed/iframe
             1. Pilih 1 video YouTube
             2. Klik Bagikan
             3. Klik Sematkan
             4. Salin kode
        -->
        <section class="card">
            <h2>Video YouTube</h2>
            <p class="desc">Video yang disematkan dari YouTube.</p>
            <div class="embed">
                <iframe
                    src="https://www.youtube.com/embed/iWoodjQ7p8g?si=5S4pIz-8V7oFHMib"
                    title="Pemutar video YouTube"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Media & Layout</p>
        </footer>
    </main>
</body>
</html>
